<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#071a2f">
<title>1×1 Fallspiel V8</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{margin:0;width:100%;height:100%;max-width:100%;overflow:hidden;background:#061426;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Arial,sans-serif;color:#fff}
body{position:fixed;inset:0}
#app{width:100%;max-width:720px;height:100dvh;max-height:100dvh;margin:0 auto;display:grid;grid-template-rows:auto auto minmax(0,1fr);gap:8px;padding:max(7px,env(safe-area-inset-top)) 7px max(7px,env(safe-area-inset-bottom));overflow:hidden;background:linear-gradient(#061426,#092b4b)}
header{width:100%;min-width:0;display:block}.title{display:none}.stats{min-width:0;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:5px}.pill{min-width:0;background:#0c355c;border:2px solid #1d78ba;border-radius:11px;padding:4px 2px;text-align:center;overflow:hidden}.pill small{display:block;font-size:clamp(7px,2.1vw,9px);opacity:.82;white-space:nowrap}.pill b{display:block;font-size:clamp(13px,4vw,18px);white-space:nowrap;line-height:1.25}#lives{font-size:clamp(12px,3.6vw,17px)}#timer{font-variant-numeric:tabular-nums}
.actions{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr;gap:6px}#abort,#restart{min-width:0;border-radius:10px;color:#fff;font-weight:950;min-height:38px}#abort{border:2px solid #b52632;background:#ef4350;font-size:12px;box-shadow:0 3px 0 #7b151d}#restart{border:2px solid #d38f00;background:#ffc928;color:#201800;font-size:16px;box-shadow:0 3px 0 #8b5c00}#abort:active,#restart:active{transform:translateY(2px);box-shadow:0 1px 0 #0008}
#task{width:100%;min-width:0;background:#f7fbff;color:#07111e;border:4px solid #a7c9e5;border-radius:17px;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 0 #00101f99;padding:7px 8px;min-height:62px;overflow:hidden}#question{max-width:100%;font-size:clamp(29px,9vw,48px);font-weight:1000;line-height:1;white-space:nowrap}
#game{position:relative;width:100%;min-width:0;min-height:0;overflow:hidden;border:3px solid #1682c7;border-radius:20px;background-color:#071b2e;background-image:linear-gradient(rgba(38,116,165,.15) 1px,transparent 1px),linear-gradient(90deg,rgba(38,116,165,.15) 1px,transparent 1px);background-size:36px 36px;box-shadow:inset 0 0 30px #000,0 4px 15px #00101f}#floor{position:absolute;left:0;right:0;bottom:0;height:9px;background:#27bb51;box-shadow:0 -5px 16px #28c85b80;z-index:2}.block{position:absolute;top:0;width:min(92px,22vw);height:min(76px,18vw);min-width:62px;min-height:56px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:clamp(27px,8vw,35px);font-weight:1000;border:3px solid rgba(255,255,255,.35);box-shadow:0 7px 0 rgba(0,0,0,.35),0 0 24px currentColor;will-change:top}.block.left{left:22%;transform:translateX(-50%);background:linear-gradient(#72dc21,#329b09)}.block.right{left:78%;transform:translateX(-50%);background:linear-gradient(#b95be8,#7425b4)}.flash{position:absolute;inset:0;pointer-events:none;opacity:0;z-index:4}.flash.good{background:#25d34d}.flash.bad{background:#ef3340}.flash.show{animation:flash .32s ease}@keyframes flash{0%{opacity:.42}100%{opacity:0}}#message{position:absolute;left:50%;top:48%;transform:translate(-50%,-50%);z-index:6;font-size:clamp(28px,8vw,52px);font-weight:1000;text-shadow:0 4px 8px #000;opacity:0;white-space:nowrap}.pop{animation:pop .55s ease}@keyframes pop{0%{opacity:0;transform:translate(-50%,-50%) scale(.6)}25%{opacity:1;transform:translate(-50%,-50%) scale(1.15)}100%{opacity:0;transform:translate(-50%,-50%) scale(1)}}
#game::after{content:"";position:absolute;top:0;bottom:0;left:50%;width:1px;background:linear-gradient(transparent,rgba(255,255,255,.12),transparent);pointer-events:none;z-index:1}
#touchHint{position:absolute;left:0;right:0;bottom:18px;z-index:3;display:flex;justify-content:space-between;padding:0 8%;font-size:clamp(11px,3vw,14px);font-weight:800;color:#b8d7ee;opacity:.48;pointer-events:none}
#start{position:absolute;inset:0;z-index:10;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:22px;background:#061426ef;overflow:auto}#start h1{font-size:clamp(34px,10vw,60px);margin:0 0 8px}#start p{max-width:390px;margin:8px 0;line-height:1.4;color:#d4eaff;font-size:clamp(14px,4vw,18px)}#start button{border:0;border-radius:18px;background:#ffc928;color:#1d1700;font-size:clamp(21px,6vw,27px);font-weight:1000;padding:14px 28px;box-shadow:0 6px 0 #a46f00;margin-top:10px}#start .best{margin-top:18px;font-weight:800;color:#ffe37c}
@media(max-width:480px){#app{gap:6px;padding-left:5px;padding-right:5px}header{display:block}.stats{grid-template-columns:repeat(5,minmax(0,1fr));gap:3px}.pill{border-width:1.5px;border-radius:9px;padding:3px 1px}.actions{gap:4px}#task{border-width:3px;min-height:58px}}
@media(max-width:360px){.pill small{font-size:7px}.pill b{font-size:13px}#lives{font-size:11px}#abort{font-size:10px}#restart{font-size:14px}}
</style>
</head>
<body><div id="app"><header><div class="stats"><div class="pill"><small>PUNKTE</small><b id="score">0</b></div><div class="pill"><small>AUFGABEN</small><b id="total">0</b></div><div class="pill"><small>FEHLER</small><b id="errors">0</b></div><div class="pill"><small>LEBEN</small><b id="lives">❤️❤️❤️</b></div><div class="pill"><small>ZEIT</small><b id="timer">00:00</b></div><div class="actions"><button id="abort" aria-label="Spiel abbrechen">ABBRUCH</button><button id="restart" aria-label="Neustart">↻ NEUSTART</button></div></div></header><div id="task"><div id="question">3 × 4 = ?</div></div><main id="game"><div id="b1" class="block left">12</div><div id="b2" class="block right">7</div><div id="floor"></div><div id="goodFlash" class="flash good"></div><div id="badFlash" class="flash bad"></div><div id="message"></div><div id="touchHint"><span>◀ LINKS</span><span>RECHTS ▶</span></div><div id="start"><h1>1 × 1</h1><p>Wähle die richtige Antwort.<br><b>Erreichen die Klötze den Boden, verlierst du ein Leben.</b></p><button id="startBtn">LOS GEHT'S</button><div class="best">🏆 Highscore: <span id="best">0</span></div></div></main></div>
<script>
(()=>{const game=document.querySelector('#game'),floor=document.querySelector('#floor'),b1=document.querySelector('#b1'),b2=document.querySelector('#b2'),scoreEl=document.querySelector('#score'),qEl=document.querySelector('#question'),msg=document.querySelector('#message'),start=document.querySelector('#start'),bestEl=document.querySelector('#best'),livesEl=document.querySelector('#lives'),errorsEl=document.querySelector('#errors'),totalEl=document.querySelector('#total'),timerEl=document.querySelector('#timer');let score=0,level=1,lives=3,errors=0,total=0,correct=0,correctSide='left',running=false,startTime=0,duration=6500,raf=0,locked=false,best=Number(localStorage.getItem('einmaleinsHighscore')||0),gameStartedAt=0,elapsedMs=0,timerId=0;bestEl.textContent=best;
function formatTime(ms){const s=Math.floor(ms/1000),m=Math.floor(s/60);return String(m).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
function updateTimer(){if(running)elapsedMs=performance.now()-gameStartedAt;timerEl.textContent=formatTime(elapsedMs)}
function startTimer(){clearInterval(timerId);gameStartedAt=performance.now();elapsedMs=0;updateTimer();timerId=setInterval(updateTimer,250)}
function stopTimer(){if(running)elapsedMs=performance.now()-gameStartedAt;clearInterval(timerId);timerId=0;timerEl.textContent=formatTime(elapsedMs)}
function wrongAnswer(a,b,c){const x=[a*(b+1),a*Math.max(1,b-1),(a+1)*b,Math.max(1,a-1)*b,c+1,Math.max(1,c-1),c+2,Math.max(1,c-2)].filter((v,i,z)=>v!==c&&v>0&&z.indexOf(v)===i);return x[Math.floor(Math.random()*x.length)]}
function newRound(){locked=false;const a=1+Math.floor(Math.random()*10),b=1+Math.floor(Math.random()*10),c=a*b,w=wrongAnswer(a,b,c);correctSide=Math.random()<.5?'left':'right';b1.textContent=correctSide==='left'?c:w;b2.textContent=correctSide==='right'?c:w;qEl.textContent=`${a} × ${b} = ?`;level=1+Math.floor(score/50);duration=Math.max(3000,6500-(level-1)*300);const spawnY=-b1.offsetHeight-12;b1.style.top=spawnY+'px';b2.style.top=spawnY+'px';startTime=performance.now()}
function loop(now){if(!running)return;const blockH=b1.offsetHeight,floorH=floor.offsetHeight,contactY=game.clientHeight-floorH-blockH,spawnY=-blockH-12,p=Math.min(1,(now-startTime)/duration),y=spawnY+p*(contactY-spawnY);b1.style.top=y+'px';b2.style.top=y+'px';if(y>=contactY-.25){b1.style.top=contactY+'px';b2.style.top=contactY+'px';answer('none')}else raf=requestAnimationFrame(loop)}
function feedback(ok,text){const f=document.querySelector(ok?'#goodFlash':'#badFlash');f.classList.remove('show');void f.offsetWidth;f.classList.add('show');msg.textContent=text;msg.className='';void msg.offsetWidth;msg.className='pop'}
function answer(side){if(!running||locked)return;locked=true;total++;totalEl.textContent=total;const ok=side===correctSide;if(ok){correct++;score+=10;scoreEl.textContent=score;feedback(true,'✓ +10');if(score>best){best=score;localStorage.setItem('einmaleinsHighscore',best);bestEl.textContent=best}}else if(side==='none'){lives--;livesEl.textContent='❤️'.repeat(lives)+'🖤'.repeat(3-lives);feedback(false,'LEBEN VERLOREN!')}else{errors++;errorsEl.textContent=errors;feedback(false,'✕')}cancelAnimationFrame(raf);if(lives<=0)setTimeout(gameOver,520);else setTimeout(()=>{if(running){newRound();raf=requestAnimationFrame(loop)}},430)}
function results(title,reason=''){stopTimer();running=false;locked=true;cancelAnimationFrame(raf);const wrong=total-correct,rate=total?Math.round(correct/total*100):0;start.querySelector('h1').textContent=title;start.querySelector('p').innerHTML=`${reason}<b>${total} Aufgaben</b><br>✓ Richtig: <b>${correct}</b> &nbsp; ✕ Falsch: <b>${wrong}</b><br>Richtigquote: <b>${rate} %</b><br>Spielzeit: <b>${formatTime(elapsedMs)}</b><br>Punkte: <b>${score}</b>`;start.querySelector('button').textContent='NOCHMAL';start.style.display='flex'}
function gameOver(){results('SPIEL VORBEI','Alle drei Leben sind weg.<br><br>')}
function begin(){score=0;level=1;lives=3;errors=0;total=0;correct=0;scoreEl.textContent='0';errorsEl.textContent='0';totalEl.textContent='0';livesEl.textContent='❤️❤️❤️';timerEl.textContent='00:00';start.style.display='none';running=true;startTimer();newRound();cancelAnimationFrame(raf);raf=requestAnimationFrame(loop)}
function abortGame(){if(!running)return;results('AUSWERTUNG','Spiel abgebrochen.<br><br>')}
function restart(){if(running)stopTimer();cancelAnimationFrame(raf);running=false;locked=true;score=0;level=1;lives=3;errors=0;total=0;correct=0;elapsedMs=0;scoreEl.textContent='0';errorsEl.textContent='0';totalEl.textContent='0';livesEl.textContent='❤️❤️❤️';timerEl.textContent='00:00';start.querySelector('h1').textContent='NEUSTART';start.querySelector('p').innerHTML='Bereit für eine neue Runde?';start.querySelector('button').textContent="LOS GEHT'S";start.style.display='flex'}
document.querySelector('#startBtn').addEventListener('click',begin);document.querySelector('#restart').addEventListener('click',restart);document.querySelector('#abort').addEventListener('click',abortGame);game.addEventListener('pointerdown',e=>{if(!running||locked)return;const r=game.getBoundingClientRect();answer(e.clientX<r.left+r.width/2?'left':'right')});addEventListener('keydown',e=>{if(e.key==='ArrowLeft')answer('left');if(e.key==='ArrowRight')answer('right')})})();
</script></body></html>
