<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#071a2f"><title>1×1 Fallspiel V3</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#061426;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Arial,sans-serif;color:#fff}body{display:flex;justify-content:center}#app{width:min(100vw,720px);height:100dvh;display:grid;grid-template-rows:auto auto 1fr auto;gap:9px;padding:max(9px,env(safe-area-inset-top)) 10px max(9px,env(safe-area-inset-bottom));background:linear-gradient(#061426,#092b4b)}header{display:flex;align-items:center;justify-content:space-between;gap:7px}.title{font-weight:950;font-size:clamp(16px,4vw,25px);white-space:nowrap}.stats{display:flex;gap:6px}.pill{background:#0c355c;border:2px solid #1d78ba;border-radius:12px;padding:5px 8px;text-align:center;min-width:62px}.pill small{display:block;font-size:9px;opacity:.8}.pill b{font-size:17px}#restart{border:2px solid #d38f00;border-radius:12px;background:#ffc928;color:#201800;font-size:20px;font-weight:950;min-width:45px;padding:6px 9px;box-shadow:0 3px 0 #8b5c00}#restart:active{transform:translateY(2px);box-shadow:0 1px 0 #8b5c00}#task{background:#f7fbff;color:#07111e;border:4px solid #a7c9e5;border-radius:17px;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 0 #00101f99;padding:8px 12px;min-height:69px}#question{font-size:clamp(30px,8vw,48px);font-weight:1000;line-height:1;white-space:nowrap}#game{position:relative;min-height:0;overflow:hidden;border:3px solid #1682c7;border-radius:20px;background-color:#071b2e;background-image:linear-gradient(rgba(38,116,165,.15) 1px,transparent 1px),linear-gradient(90deg,rgba(38,116,165,.15) 1px,transparent 1px);background-size:36px 36px;box-shadow:inset 0 0 30px #000,0 4px 15px #00101f}#floor{position:absolute;left:0;right:0;bottom:0;height:9px;background:#27bb51;box-shadow:0 -5px 16px #28c85b80;z-index:2}.block{position:absolute;top:0;width:92px;height:76px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:35px;font-weight:1000;border:3px solid rgba(255,255,255,.35);box-shadow:0 7px 0 rgba(0,0,0,.35),0 0 24px currentColor;will-change:transform}.block.left{left:22%;transform:translateX(-50%);background:linear-gradient(#72dc21,#329b09)}.block.right{left:78%;transform:translateX(-50%);background:linear-gradient(#b95be8,#7425b4)}.flash{position:absolute;inset:0;pointer-events:none;opacity:0;z-index:4}.flash.good{background:#25d34d}.flash.bad{background:#ef3340}.flash.show{animation:flash .32s ease}@keyframes flash{0%{opacity:.42}100%{opacity:0}}#message{position:absolute;left:50%;top:48%;transform:translate(-50%,-50%);z-index:6;font-size:clamp(28px,8vw,52px);font-weight:1000;text-shadow:0 4px 8px #000;opacity:0;white-space:nowrap}.pop{animation:pop .55s ease}@keyframes pop{0%{opacity:0;transform:translate(-50%,-50%) scale(.6)}25%{opacity:1;transform:translate(-50%,-50%) scale(1.15)}100%{opacity:0;transform:translate(-50%,-50%) scale(1)}}footer{display:grid;grid-template-columns:1fr 1fr;gap:12px}.choice{border:0;border-radius:19px;color:white;font-size:48px;font-weight:900;min-height:78px;box-shadow:inset 0 3px 0 #ffffff55,0 6px 0 #0007}.choice:active{transform:translateY(4px);box-shadow:inset 0 2px 0 #ffffff55,0 2px 0 #0007}#left{background:linear-gradient(#65d51a,#2c9705)}#right{background:linear-gradient(#b953e0,#7624ad)}#start{position:absolute;inset:0;z-index:10;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:30px;background:#061426ef}#start h1{font-size:clamp(35px,10vw,64px);margin:0 0 8px}#start p{max-width:390px;line-height:1.4;color:#d4eaff}#start button{border:0;border-radius:18px;background:#ffc928;color:#1d1700;font-size:25px;font-weight:1000;padding:15px 32px;box-shadow:0 6px 0 #a46f00;margin-top:10px}#start .best{margin-top:18px;font-weight:800;color:#ffe37c}@media(max-width:420px){#app{padding-left:7px;padding-right:7px}.pill{min-width:55px;padding:4px}.pill b{font-size:15px}.block{width:78px;height:68px;font-size:31px}.choice{font-size:42px;min-height:72px}}
</style></head><body><div id="app"><header><div class="title">🧠 1×1</div><div class="stats"><div class="pill"><small>PUNKTE</small><b id="score">0</b></div><div class="pill"><small>LEVEL</small><b id="level">1</b></div><div class="pill"><small>LEBEN</small><b id="lives">❤️❤️❤️</b></div><button id="restart" aria-label="Neustart">↻</button></div></header><div id="task"><div id="question">3 × 4 = ?</div></div><main id="game"><div id="b1" class="block left">12</div><div id="b2" class="block right">7</div><div id="floor"></div><div id="goodFlash" class="flash good"></div><div id="badFlash" class="flash bad"></div><div id="message"></div><div id="start"><h1>1 × 1</h1><p>Wähle die richtige Antwort.<br><b>Erreichen die Klötze den Boden, verlierst du ein Leben.</b></p><button id="startBtn">LOS GEHT'S</button><div class="best">🏆 Highscore: <span id="best">0</span></div></div></main><footer><button id="left" class="choice" aria-label="Linke Antwort">←</button><button id="right" class="choice" aria-label="Rechte Antwort">→</button></footer></div>
<script>
(()=>{const game=document.querySelector('#game'),floor=document.querySelector('#floor'),b1=document.querySelector('#b1'),b2=document.querySelector('#b2'),scoreEl=document.querySelector('#score'),levelEl=document.querySelector('#level'),qEl=document.querySelector('#question'),msg=document.querySelector('#message'),start=document.querySelector('#start'),bestEl=document.querySelector('#best'),livesEl=document.querySelector('#lives');let score=0,level=1,lives=3,correctSide='left',running=false,startTime=0,duration=6500,raf=0,locked=false,best=Number(localStorage.getItem('einmaleinsHighscore')||0);bestEl.textContent=best;function wrongAnswer(a,b,c){const x=[a*(b+1),a*Math.max(1,b-1),(a+1)*b,Math.max(1,a-1)*b,c+1,Math.max(1,c-1),c+2,Math.max(1,c-2)].filter((v,i,z)=>v!==c&&v>0&&z.indexOf(v)===i);return x[Math.floor(Math.random()*x.length)]}function newRound(){locked=false;const a=1+Math.floor(Math.random()*10),b=1+Math.floor(Math.random()*10),c=a*b,w=wrongAnswer(a,b,c);correctSide=Math.random()<.5?'left':'right';b1.textContent=correctSide==='left'?c:w;b2.textContent=correctSide==='right'?c:w;qEl.textContent=`${a} × ${b} = ?`;level=1+Math.floor(score/50);levelEl.textContent=level;duration=Math.max(3000,6500-(level-1)*300);const spawnY=-b1.offsetHeight-12;b1.style.top=spawnY+'px';b2.style.top=spawnY+'px';startTime=performance.now()}function loop(now){if(!running)return;const blockH=b1.offsetHeight;const floorH=floor.offsetHeight;const contactY=game.clientHeight-floorH-blockH;const spawnY=-blockH-12;const p=Math.min(1,(now-startTime)/duration);const y=spawnY+p*(contactY-spawnY);b1.style.top=y+'px';b2.style.top=y+'px';if(y>=contactY-.25){b1.style.top=contactY+'px';b2.style.top=contactY+'px';answer('none')}else raf=requestAnimationFrame(loop)}function feedback(ok,text){const f=document.querySelector(ok?'#goodFlash':'#badFlash');f.classList.remove('show');void f.offsetWidth;f.classList.add('show');msg.textContent=text;msg.className='';void msg.offsetWidth;msg.className='pop'}function answer(side){if(!running||locked)return;locked=true;const ok=side===correctSide;if(ok){score+=10;scoreEl.textContent=score;feedback(true,'✓ +10');if(score>best){best=score;localStorage.setItem('einmaleinsHighscore',best);bestEl.textContent=best}}else{if(side==='none'){lives--;livesEl.textContent='❤️'.repeat(lives)+'🖤'.repeat(3-lives);feedback(false,'LEBEN VERLOREN!')}else feedback(false,'✕')}cancelAnimationFrame(raf);if(lives<=0){setTimeout(gameOver,520)}else setTimeout(()=>{if(running){newRound();raf=requestAnimationFrame(loop)}},430)}function gameOver(){running=false;locked=true;start.querySelector('h1').textContent='SPIEL VORBEI';start.querySelector('p').innerHTML=`Du hast <b>${score} Punkte</b> geschafft.<br>Alle drei Leben sind weg.`;start.querySelector('button').textContent='NOCHMAL';start.style.display='flex'}function begin(){score=0;level=1;lives=3;scoreEl.textContent='0';levelEl.textContent='1';livesEl.textContent='❤️❤️❤️';start.style.display='none';running=true;newRound();cancelAnimationFrame(raf);raf=requestAnimationFrame(loop)}function restart(){cancelAnimationFrame(raf);running=false;locked=true;score=0;level=1;lives=3;scoreEl.textContent='0';levelEl.textContent='1';livesEl.textContent='❤️❤️❤️';start.querySelector('h1').textContent='NEUSTART';start.querySelector('p').innerHTML='Bereit für eine neue Runde?';start.querySelector('button').textContent="LOS GEHT'S";start.style.display='flex'}document.querySelector('#startBtn').addEventListener('click',begin);document.querySelector('#restart').addEventListener('click',restart);document.querySelector('#left').addEventListener('pointerdown',()=>answer('left'));document.querySelector('#right').addEventListener('pointerdown',()=>answer('right'));addEventListener('keydown',e=>{if(e.key==='ArrowLeft')answer('left');if(e.key==='ArrowRight')answer('right')})})();
</script></body></html>
