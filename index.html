<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#071a2f">
<title>1×1 Fallspiel</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#061426;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Arial,sans-serif;color:#fff}
body{display:flex;justify-content:center}
#app{width:min(100vw,720px);height:100dvh;display:grid;grid-template-rows:auto 1fr auto;gap:10px;padding:max(10px,env(safe-area-inset-top)) 12px max(10px,env(safe-area-inset-bottom));background:linear-gradient(#061426,#092b4b)}
header{display:flex;align-items:center;justify-content:space-between;gap:8px}
.title{font-weight:900;font-size:clamp(18px,4vw,28px);letter-spacing:.5px}.stats{display:flex;gap:7px}.pill{background:#0c355c;border:2px solid #1d78ba;border-radius:13px;padding:6px 9px;text-align:center;min-width:72px;box-shadow:inset 0 0 14px #00182d}.pill small{display:block;font-size:10px;opacity:.8}.pill b{font-size:18px}
#game{position:relative;min-height:0;overflow:hidden;border:3px solid #1682c7;border-radius:20px;background-color:#071b2e;background-image:linear-gradient(rgba(38,116,165,.15) 1px,transparent 1px),linear-gradient(90deg,rgba(38,116,165,.15) 1px,transparent 1px);background-size:36px 36px;box-shadow:inset 0 0 30px #000,0 4px 15px #00101f}
#game:after{content:"";position:absolute;left:0;right:0;bottom:0;height:7px;background:#20a64a;box-shadow:0 -5px 16px #28c85b80}
.block{position:absolute;top:-90px;width:92px;height:76px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:35px;font-weight:1000;border:3px solid rgba(255,255,255,.35);box-shadow:0 7px 0 rgba(0,0,0,.35),0 0 24px currentColor;will-change:transform}
.block.left{left:20%;transform:translateX(-50%);background:linear-gradient(#72dc21,#329b09);color:white}.block.right{left:80%;transform:translateX(-50%);background:linear-gradient(#b95be8,#7425b4);color:white}
.flash{position:absolute;inset:0;pointer-events:none;opacity:0;z-index:4}.flash.good{background:#25d34d}.flash.bad{background:#ef3340}.flash.show{animation:flash .32s ease}@keyframes flash{0%{opacity:.42}100%{opacity:0}}
#message{position:absolute;left:50%;top:48%;transform:translate(-50%,-50%) scale(.8);z-index:6;font-size:clamp(28px,8vw,52px);font-weight:1000;text-shadow:0 4px 8px #000;opacity:0;white-space:nowrap}.pop{animation:pop .55s ease}@keyframes pop{0%{opacity:0;transform:translate(-50%,-50%) scale(.6)}25%{opacity:1;transform:translate(-50%,-50%) scale(1.15)}100%{opacity:0;transform:translate(-50%,-50%) scale(1)}}
footer{display:grid;grid-template-columns:88px 1fr 88px;gap:10px;align-items:stretch}.choice{border:0;border-radius:19px;color:white;font-size:48px;font-weight:900;min-height:82px;box-shadow:inset 0 3px 0 #ffffff55,0 6px 0 #0007}.choice:active{transform:translateY(4px);box-shadow:inset 0 2px 0 #ffffff55,0 2px 0 #0007}#left{background:linear-gradient(#65d51a,#2c9705)}#right{background:linear-gradient(#b953e0,#7624ad)}
#task{background:#f7fbff;color:#07111e;border:4px solid #a7c9e5;border-radius:19px;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 6px 0 #00101f99;min-width:0}#task small{font-size:11px;color:#1b5790;font-weight:900}#question{font-size:clamp(27px,7vw,44px);font-weight:1000;line-height:1.05;white-space:nowrap}
#start{position:absolute;inset:0;z-index:10;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:30px;background:#061426eF}#start h1{font-size:clamp(35px,10vw,64px);margin:0 0 8px}#start p{max-width:390px;line-height:1.4;color:#d4eaff}#start button{border:0;border-radius:18px;background:#ffc928;color:#1d1700;font-size:25px;font-weight:1000;padding:15px 32px;box-shadow:0 6px 0 #a46f00;margin-top:10px}#start .best{margin-top:18px;font-weight:800;color:#ffe37c}
@media(max-width:420px){#app{padding-left:8px;padding-right:8px}.pill{min-width:61px;padding:5px}.pill b{font-size:16px}.block{width:78px;height:68px;font-size:31px}footer{grid-template-columns:74px 1fr 74px}.choice{font-size:42px;min-height:76px}}
</style>
</head>
<body>
<div id="app">
<header><div class="title">🧠 1×1 FALLSPIEL</div><div class="stats"><div class="pill"><small>PUNKTE</small><b id="score">0</b></div><div class="pill"><small>LEVEL</small><b id="level">1</b></div></div></header>
<main id="game">
 <div id="b1" class="block left">12</div><div id="b2" class="block right">7</div>
 <div id="goodFlash" class="flash good"></div><div id="badFlash" class="flash bad"></div><div id="message"></div>
 <div id="start"><h1>1 × 1</h1><p>Finde die richtige Antwort, bevor die Klötze den Boden erreichen.<br><b>Links oder rechts drücken!</b></p><button id="startBtn">LOS GEHT'S</button><div class="best">🏆 Highscore: <span id="best">0</span></div></div>
</main>
<footer><button id="left" class="choice" aria-label="Linke Antwort">←</button><div id="task"><small>AUFGABE</small><div id="question">3 × 4 = ?</div></div><button id="right" class="choice" aria-label="Rechte Antwort">→</button></footer>
</div>
<script>
(()=>{
 const game=document.querySelector('#game'), b1=document.querySelector('#b1'), b2=document.querySelector('#b2');
 const scoreEl=document.querySelector('#score'),levelEl=document.querySelector('#level'),qEl=document.querySelector('#question'),msg=document.querySelector('#message');
 const start=document.querySelector('#start'),bestEl=document.querySelector('#best');
 let score=0,level=1,correctSide='left',running=false,startTime=0,duration=6500,raf=0,locked=false;
 let best=Number(localStorage.getItem('einmaleinsHighscore')||0); bestEl.textContent=best;
 function wrongAnswer(a,b,correct){
   const candidates=[a*(b+1),a*Math.max(1,b-1),(a+1)*b,Math.max(1,a-1)*b,correct+1,Math.max(1,correct-1),correct+2,Math.max(1,correct-2)].filter((v,i,x)=>v!==correct&&v>0&&x.indexOf(v)===i);
   return candidates[Math.floor(Math.random()*candidates.length)];
 }
 function newRound(){
   locked=false; const a=1+Math.floor(Math.random()*10), b=1+Math.floor(Math.random()*10), correct=a*b, wrong=wrongAnswer(a,b,correct);
   correctSide=Math.random()<.5?'left':'right'; b1.textContent=correctSide==='left'?correct:wrong; b2.textContent=correctSide==='right'?correct:wrong; qEl.textContent=`${a} × ${b} = ?`;
   level=1+Math.floor(score/50); levelEl.textContent=level; duration=Math.max(2850,6500-(level-1)*320); startTime=performance.now();
 }
 function loop(now){
   if(!running)return; let p=(now-startTime)/duration; const maxY=game.clientHeight-90; const y=Math.max(0,p*maxY); b1.style.top=(y-78)+'px'; b2.style.top=(y-78)+'px';
   if(p>=1){answer('none');} else raf=requestAnimationFrame(loop);
 }
 function feedback(ok,text){
   const f=document.querySelector(ok?'#goodFlash':'#badFlash'); f.classList.remove('show'); void f.offsetWidth; f.classList.add('show'); msg.textContent=text; msg.className=''; void msg.offsetWidth; msg.className='pop';
 }
 function answer(side){
   if(!running||locked)return; locked=true; const ok=side===correctSide;
   if(ok){score+=10; scoreEl.textContent=score; feedback(true,'✓ +10'); if(score>best){best=score;localStorage.setItem('einmaleinsHighscore',best)}} else feedback(false,side==='none'?'ZU SPÄT!':'✕');
   cancelAnimationFrame(raf); setTimeout(()=>{newRound();raf=requestAnimationFrame(loop)},430);
 }
 function begin(){score=0;level=1;scoreEl.textContent=0;levelEl.textContent=1;start.style.display='none';running=true;newRound();cancelAnimationFrame(raf);raf=requestAnimationFrame(loop)}
 document.querySelector('#startBtn').addEventListener('click',begin); document.querySelector('#left').addEventListener('pointerdown',()=>answer('left')); document.querySelector('#right').addEventListener('pointerdown',()=>answer('right'));
 addEventListener('keydown',e=>{if(e.key==='ArrowLeft')answer('left');if(e.key==='ArrowRight')answer('right')});
 document.addEventListener('visibilitychange',()=>{if(document.hidden&&running){cancelAnimationFrame(raf);running=false;start.style.display='flex';start.querySelector('h1').textContent='PAUSE';start.querySelector('p').innerHTML='Tippe auf den Knopf, um neu zu starten.';start.querySelector('button').textContent='WEITER'}});
})();
</script>
</body>
</html>
